<meta charset="utf-8">
<title>mimiwatch</title>
<link rel="stylesheet" href="popup.css">
<div class="wrap">
  <h1>mimi<em>watch</em></h1>
  <p id="err" class="err" hidden></p>
  <label>무엇을 얹을까요
    <select id="pick"><option value="">— 고르지 않음 —</option></select>
  </label>

  <!-- 지금 이 탭에서 바로 시작합니다. 주소를 다시 붙여 넣을 이유가 없습니다
       -- 확장은 이미 어느 탭인지 압니다. -->
  <fieldset id="start-box">
    <legend>이 탭에서 새로 받아 적기</legend>
    <div class="row">
      <button id="start-url" class="seg">주소로</button>
      <button id="start-tab" class="seg">이 탭 소리로</button>
    </div>
    <p class="hint" id="start-hint">주소로 받으면 브라우저를 닫아도 서버가 계속 받습니다.
      멤버십 전용처럼 서버가 받지 못하는 방송은 탭 소리로 받으십시오.</p>
    <div class="row">
      <label class="slider">언어
        <select id="lang">
          <option value="">자동</option>
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="ko">한국어</option>
          <option value="zh">中文</option>
        </select>
      </label>
      <label class="slider">장르 <select id="genre"></select></label>
    </div>
    <label>콘텐츠 유형
      <select id="profile"></select>
      <small id="profile-hint">발화를 몇 초에 끊을지 정합니다.</small>
    </label>
    <label class="check"><input id="refine" type="checkbox"> 정제본으로 다듬기</label>
    <p class="hint">켜면 발화 한 무리가 끝나기를 기다렸다 합쳐서 다시 받아
      적습니다. 문맥이 길어져 정확해지지만 자막이 늦게 자리를 잡고 이미 뜬
      줄이 바뀝니다. <b>라이브에서는 대개 꺼 두는 편이 낫습니다.</b></p>
  </fieldset>
  <div class="row">
    <button class="seg" data-mode="both">둘 다</button>
    <button class="seg" data-mode="translation">번역만</button>
    <button class="seg" data-mode="source">원문만</button>
    <button class="seg" data-mode="off">끄기</button>
  </div>
  <label class="slider">글자 크기 <input id="size" type="range" min="16" max="56"></label>
  <label class="slider">배경 <input id="dim" type="range" min="0" max="100"></label>
  <label class="slider">오프셋 <input id="offset" type="range" min="-5" max="5" step="0.1"><b id="offset-val">0.0s</b></label>
  <label class="check"><input id="show-prev" type="checkbox"> 직전 문장 남기기</label>
  <label class="check"><input id="panel" type="checkbox"> 자막 내역을 채팅 자리에</label>
  <div class="row">
    <button id="reset-pos" class="seg">⤾ 위치 되돌리기</button>
    <span class="grow"></span>
    <button id="hide" class="seg" title="화면에서만 내립니다. 받아 적기는 계속됩니다">화면에서 내리기</button>
  </div>
  <div class="row">
    <button id="stop" class="seg danger wide" title="이 탭의 세션을 서버에서 끝냅니다">■ 받아 적기 중단</button>
  </div>
  <p class="hint" id="state">—</p>
  <label class="slider">서버 <input id="base" type="text" spellcheck="false"></label>
</div>
<script src="popup.js"></script>
