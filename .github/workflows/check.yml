# Only the checks that run without a model. The transcription runtime
# (transcribe.cpp) has no Linux wheel, so the tests stand in a fake module for it
# (tests/conftest.py). No test loads a model.
name: check

# Runs on a push to main and on a PR against main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy pytest ruff
      - name: ruff (syntax, unused names)
        run: ruff check .
      - name: pytest
        run: python -m pytest
      - name: Extension copies and shape
        run: python bench/ext_check.py
