<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mimiwatch</title>
<link rel="stylesheet" href="/static/app.css">
<body>

<!-- The top bar holds only what is being watched right now and what is running.
     The video list and add/delete moved into the left panel, and the engine and
     language settings were gathered under "Manage". -->
<header class="bar">
  <div class="brand">mimi<em>watch</em></div>
  <button id="toggle-library" class="seg" data-i18n="header.videos"
          data-i18n-attr="title:header.videos.title"></button>

  <div class="now">
    <b id="now-title" data-i18n="header.now.empty"></b>
    <!-- Tab audio carries no title to take. Chrome puts an opaque identifier in
         the track label rather than the tab title (measured). So the name has
         to be fixable afterwards. -->
    <button id="rename-live" class="seg" hidden data-i18n="header.rename"
            data-i18n-attr="title:header.rename.title"></button>
    <div id="live-badge" class="live-badge" hidden>● LIVE <button id="live-stop" data-i18n="header.live.stop"></button></div>
  </div>

  <!-- Job status goes at the top. It used to float at the bottom right, where
       neither the fact that transcription was running nor where the Stop button
       was caught the eye. -->
  <div id="job" class="job" hidden>
    <span class="job-label" data-i18n="job.retranslating"></span>
    <span class="job-bar"><i id="job-fill"></i></span>
    <span id="job-count" class="job-count"></span>
    <span id="job-source" class="job-count"></span>
    <button id="job-cancel" class="seg" data-i18n="job.cancel"></button>
  </div>

  <div id="live-notice" class="live-notice" hidden></div>
  <!-- First run: the models transcription needs are not here yet. This used to
       be discovered only by starting a session and getting a FileNotFoundError.
       Someone who took the bundle has no install script, so let them download
       from here. -->
  <div id="setup-notice" class="live-notice setup-notice" hidden>
    <span id="setup-text" data-i18n="setup.notice.noModels"></span>
    <button id="setup-start" class="seg primary-seg" data-i18n="setup.notice.start"></button>
    <button id="setup-download" class="seg" data-i18n="setup.notice.download"></button>
    <button id="setup-open" class="seg" data-i18n="setup.notice.models"></button>
  </div>
  <!-- Update. Once a day the GitHub releases are checked, and a newer version is
       announced here. Download and apply only when running as a bundle -- in
       repo mode it only points at git pull. -->
  <div id="update-notice" class="live-notice" hidden>
    <span id="update-text"></span>
    <button id="update-download" class="seg primary-seg" hidden data-i18n="update.download"></button>
    <button id="update-apply" class="seg primary-seg" hidden data-i18n="update.apply"></button>
    <button id="update-dismiss" class="seg" hidden data-i18n="update.later"></button>
  </div>
  <div id="lang-status" class="status"></div>
  <div class="spacer"></div>

  <div class="menu-wrap">
    <button id="open-manage" class="seg" aria-haspopup="true" aria-expanded="false"
            data-i18n="header.manage"></button>
    <div id="manage-menu" class="menu" hidden>
      <label class="field col">
        <span data-i18n="manage.myLanguage"></span>
        <select id="viewer-lang">
          <option value="ko" data-i18n="lang.ko"></option>
          <option value="en" data-i18n="lang.en"></option>
          <option value="ja" data-i18n="lang.ja"></option>
          <option value="zh" data-i18n="lang.zh"></option>
        </select>
      </label>
      <label class="field col">
        <span data-i18n="manage.uiLanguage"></span>
        <select id="ui-lang">
          <option value="en" data-i18n="lang.en"></option>
          <option value="ko" data-i18n="lang.ko"></option>
        </select>
      </label>
      <label class="field col" id="asr-field">
        <span data-i18n="manage.asr"></span>
        <select id="asr-picker"></select>
      </label>
      <label class="field col" id="backend-field">
        <span data-i18n="manage.translation"></span>
        <select id="backend-picker"></select>
      </label>
      <hr>
      <button id="open-settings" class="seg wide" data-i18n="manage.engines"></button>
    </div>
  </div>

  <button id="toggle-panel" class="seg" data-i18n="header.panel"
          data-i18n-attr="title:header.panel.title"></button>
  <!-- Run as a bundle there is no terminal, so Ctrl-C cannot shut it down. Put it
       somewhere visible. Broadcasts still being received are closed cleanly
       first, then the server stops, then this window (and the script window). -->
  <button id="quit" class="seg quit" data-i18n="header.quit"
          data-i18n-attr="title:header.quit.title"></button>
</header>

<main id="layout">
  <!-- Video management. Collapses and expands the same way the subtitle log does. -->
  <aside class="library" id="library">
    <div class="panel-head">
      <h2 data-i18n="library.title"></h2>
      <button id="add-video" class="seg primary-seg" data-i18n="library.add"
              data-i18n-attr="title:library.add.title"></button>
    </div>
    <div class="panel-search">
      <input id="library-search" type="search" autocomplete="off"
             data-i18n-attr="placeholder:library.search.ph">
    </div>
    <div id="video-list" class="video-list"></div>
  </aside>

  <section class="stage">
    <div id="player-wrap" class="mv-1">
      <!-- tiles.js stamps tiles out of this template (several of them for
           multiview). With one tile neither the bar (.tile-bar) nor the cover
           (.tile-cover) is visible, so the screen is what the old #player +
           #overlay was. The cover stays only on unfocused tiles; clicking it
           moves the focus, and the focused tile's player controls still work. -->
      <template id="tile-tpl">
        <div class="tile">
          <div class="tile-player"></div>
          <div class="overlay">
            <div class="cue-prev"></div>
            <div class="cue-main"></div>
            <div class="cue-src"></div>
          </div>
          <div class="tile-bar">
            <span class="tile-site"></span>
            <span class="tile-title"></span>
            <span class="tile-state"></span>
            <span class="tile-sound" data-i18n-attr="title:tile.sound.title">🔊</span>
            <button class="tile-close seg" data-i18n-attr="title:tile.close.title">✕</button>
          </div>
          <div class="tile-cover" data-i18n-attr="title:tile.cover.title"></div>
          <!-- A film that appears only while something is being dragged. A drop never reaches an iframe, so this catches it. -->
          <div class="tile-drop"></div>
        </div>
      </template>

      <!-- In fullscreen the controls outside the box are not drawn. Keep the
           subtitle mode inside the box too. In windowed mode the controls below
           are there, so hide these. -->
      <div id="fs-controls" class="fs-controls">
        <span class="glabel" data-i18n="controls.subtitle"></span>
        <div class="fs-row seg-row">
          <button class="seg" data-mode="off" data-i18n="controls.mode.off"></button>
          <button class="seg" data-mode="both" data-needs-translation data-i18n="controls.mode.both"></button>
          <button class="seg" data-mode="translation" data-needs-translation data-i18n="controls.mode.translation"></button>
          <button class="seg" data-mode="source" data-i18n="controls.mode.source"></button>
        </div>
        <hr>
        <div class="fs-row">
          <label class="slider"><span data-i18n="controls.fontSize"></span> <input type="range" min="16" max="56" data-ctl="size"></label>
          <label class="slider"><span data-i18n="controls.background"></span> <input type="range" min="0" max="100" data-ctl="dim"></label>
          <button class="seg" data-cue-reset data-i18n="controls.cueReset"
                  data-i18n-attr="title:fs.cueReset.title"></button>
        </div>
        <hr>
        <!-- Multiview: layout and focus. Visible only with two or more tiles. -->
        <div class="fs-row seg-row" id="fs-mv" hidden>
          <button class="seg" data-layout="2" data-i18n="controls.layout.vertical"></button>
          <button class="seg" data-layout="2h" data-i18n="controls.layout.horizontal"></button>
          <button class="seg" data-layout="1p2">1+2</button>
          <button class="seg" data-layout="1p3">1+3</button>
          <button class="seg" data-layout="2x2">2×2</button>
          <button class="seg" data-focus-tile="0">1</button>
          <button class="seg" data-focus-tile="1">2</button>
          <button class="seg" data-focus-tile="2">3</button>
          <button class="seg" data-focus-tile="3">4</button>
        </div>
        <button id="fs-exit" class="seg" data-i18n="fs.exit"></button>
      </div>

      <!-- Where the controls are called back.
           The iframe covers the box, so mouse movement over the video never
           reaches us. Hence this strip laid on top of the iframe.
           The subtitles sit bottom-centre and the YouTube control row at the
           very bottom, so it avoids both and sits at the right edge, halfway
           down. -->
      <div id="fs-hotzone" class="fs-hotzone" aria-hidden="true"></div>
    </div>

    <div class="controls">
      <div class="group">
        <span class="glabel" data-i18n="controls.subtitle"></span>
        <button class="seg" data-mode="off" data-i18n="controls.mode.off"></button>
        <button class="seg" data-mode="both" data-needs-translation data-i18n="controls.mode.both"></button>
        <button class="seg" data-mode="translation" data-needs-translation data-i18n="controls.mode.translation"></button>
        <button class="seg" data-mode="source" data-i18n="controls.mode.source"></button>
      </div>
      <label class="slider"><span data-i18n="controls.fontSize"></span> <input id="size" type="range" min="16" max="56" value="30"></label>
      <label class="slider"><span data-i18n="controls.background"></span> <input id="dim" type="range" min="0" max="100" value="55"></label>
      <!-- Position is adjusted by dragging the subtitles themselves, not with a
           slider. The only button left is the one that puts them back. -->
      <button id="cue-reset" class="seg" data-cue-reset data-i18n="controls.cueReset"
              data-i18n-attr="title:controls.cueReset.title"></button>
      <label class="check"><input id="show-prev" type="checkbox" checked> <span data-i18n="controls.showPrev"></span></label>
      <label class="slider" id="offset-wrap"><span data-i18n="controls.offset"></span> <input id="offset" type="range" min="-3" max="3" step="0.1" value="0"><b id="offset-val">0.0s</b></label>
      <button id="fullscreen" class="seg" data-i18n="controls.fullscreen"
              data-i18n-attr="title:controls.fullscreen.title"></button>
      <!-- Multiview. "Add tile" is visible when the focus is live, the layout when
           there are two or more tiles. The focus moves by clicking a tile or with
           the 1~4 keys. -->
      <button id="mv-add" class="seg" hidden data-i18n="controls.addTile"
              data-i18n-attr="title:controls.addTile.title"></button>
      <div class="group" id="mv-group" hidden>
        <span class="glabel" data-i18n="controls.layout"></span>
        <button class="seg" data-layout="2" data-i18n="controls.layout.vertical"></button>
          <button class="seg" data-layout="2h" data-i18n="controls.layout.horizontal"></button>
        <button class="seg" data-layout="1p2">1+2</button>
        <button class="seg" data-layout="1p3">1+3</button>
        <button class="seg" data-layout="2x2">2×2</button>
      </div>
    </div>
  </section>

  <aside class="panel">
    <div class="panel-head">
      <h2 data-i18n="panel.title"></h2>
      <button id="open-script-window" class="seg" data-i18n="panel.popout"
              data-i18n-attr="title:panel.popout.title"></button>
      <button id="open-export" class="seg" data-i18n="panel.export"
              data-i18n-attr="title:panel.export.title"></button>
      <label class="check"><input id="follow" type="checkbox" checked> <span data-i18n="panel.follow"></span></label>
    </div>

    <!-- What happens when a line in the subtitle log is clicked.
         The default is what it has always been, "seek there". Editing and
         picking are fenced off behind a mode that has to be turned on -- reading
         must never open the editor or jump the playhead by a misclick. -->
    <div class="script-modes" role="group" data-i18n-attr="aria-label:panel.modes.aria">
      <button class="seg" data-smode="read" data-i18n="panel.mode.read"
              data-i18n-attr="title:panel.mode.read.title"></button>
      <button class="seg" data-smode="edit" data-i18n="panel.mode.edit"
              data-i18n-attr="title:panel.mode.edit.title"></button>
      <button class="seg" data-smode="tr" data-i18n="panel.mode.tr"
              data-i18n-attr="title:panel.mode.tr.title"></button>
    </div>

    <!-- Visible in translation mode only. How many lines are picked and what to do with them. -->
    <div id="tr-bar" class="tr-bar" hidden>
      <b id="tr-count" data-i18n="panel.tr.count.zero"></b>
      <span class="grow"></span>
      <button id="tr-all" class="seg" data-i18n="panel.tr.all"></button>
      <button id="tr-none" class="seg" data-i18n="panel.tr.none"></button>
      <button id="tr-go" class="seg primary-seg" data-i18n="panel.tr.go"></button>
    </div>

    <!-- Visible in edit mode only. Fills in by hand the places misrecognised and dropped (missing lines). -->
    <div id="edit-bar" class="tr-bar" hidden>
      <b data-i18n="panel.edit.hint"></b>
      <span class="grow"></span>
      <button id="cue-add" class="seg primary-seg" data-i18n="panel.edit.add"
              data-i18n-attr="title:panel.edit.add.title"></button>
    </div>

    <!-- Controls visible only in the popped-out window. There is no video there,
         so instead of the on-screen subtitles it holds only what makes the
         subtitle log itself easier to read. -->
    <div id="script-tools" class="script-tools">
      <div class="fs-row seg-row">
        <button class="seg" data-sview="both" data-i18n="controls.mode.both"></button>
        <button class="seg" data-sview="tr" data-i18n="controls.mode.translation"></button>
        <button class="seg" data-sview="src" data-i18n="controls.mode.source"></button>
      </div>
      <label class="slider"><span data-i18n="controls.fontSize"></span>
        <input id="script-size" type="range" min="11" max="24" value="13">
      </label>
    </div>

    <div id="script" class="script"></div>
  </aside>
</main>

<dialog id="add-dialog">
  <form method="dialog" id="add-form">
    <h3 data-i18n="add.title"></h3>
    <p class="hint" data-i18n="add.hint"></p>
    <p class="hint" id="tile-hint" hidden data-i18n="add.tileHint"></p>
    <label><span data-i18n="add.source"></span>
      <select name="source">
        <option value="url" data-i18n="add.source.url"></option>
        <option value="tab" data-i18n="add.source.tab"><!-- members-only --></option>
        <option value="file" data-i18n="add.source.file"></option>
      </select>
      <small id="source-hint" data-i18n="add.source.hint.url"></small>
    </label>
    <label id="url-field"><span data-i18n="add.url"></span> <input name="url" data-i18n-attr="placeholder:add.url.placeholder"></label>
    <label id="file-field" hidden><span data-i18n="add.file"></span>
      <input type="file" name="media" accept="video/*,audio/*,.mkv,.ts,.m4a,.opus,.aac,.flac">
      <small data-i18n="add.file.hint"></small>
    </label>
    <label id="tab-title-field" hidden><span data-i18n="add.name"></span>
      <input name="tab_title" data-i18n-attr="placeholder:add.name.placeholder">
      <small data-i18n="add.name.hint"></small>
    </label>
    <label id="channel-field" hidden><span data-i18n="add.channel"></span>
      <input name="channel_name" data-i18n-attr="placeholder:add.channel.placeholder">
      <small data-i18n="add.channel.hint"></small>
    </label>
    <label><span data-i18n="add.genre"></span>
      <select name="genre"></select>
      <small id="genre-hint" data-i18n="add.genre.hint"></small>
    </label>
    <!-- Binds the tag and the text into one lump. This label is a vertical flex
         (the other two carrying an "… only" tag are label.inline, so horizontal),
         and left alone the tag takes a whole line to itself and stretches. -->
    <label><span><span data-i18n="add.profile"></span> <small class="tag" data-i18n="add.tag.liveOnly"></small></span>
      <select name="profile"></select>
      <small data-i18n="add.profile.hint"></small>
    </label>
    <label class="inline"><input type="checkbox" name="refine" checked> <span data-i18n="add.refine"></span>
           <small class="tag" data-i18n="add.refine.tag"></small></label>
    <small class="hint" data-i18n="add.refine.hint"></small>
    <label class="inline"><input type="checkbox" name="speakers"> <span data-i18n="add.speakers"></span>
           <small class="tag" data-i18n="add.tag.vodOnly"></small></label>
    <label><span data-i18n="add.asr"></span>
      <select name="asr"></select>
      <small data-i18n="add.asr.hint"></small>
    </label>
    <label><span data-i18n="add.backend"></span>
      <select name="backend"></select>
    </label>
    <label><span data-i18n="add.lang"></span>
      <select name="lang">
        <option value="" data-i18n="lang.auto"></option>
        <option value="ko" data-i18n="lang.ko"></option>
        <option value="en" data-i18n="lang.en"></option>
        <option value="ja" data-i18n="lang.ja"></option>
        <option value="zh" data-i18n="lang.zh"></option>
      </select>
      <small data-i18n="add.lang.hint"></small>
    </label>
    <div class="row">
      <span class="grow"></span>
      <button value="cancel" formnovalidate data-i18n="dialog.cancel"></button>
      <button value="save" class="primary" data-i18n="add.start"></button>
    </div>
  </form>
</dialog>

<dialog id="export-dialog">
  <form method="dialog" id="export-form">
    <h3 data-i18n="export.title"></h3>
    <p class="hint" id="export-what">—</p>
    <label><span data-i18n="export.fmt"></span>
      <select name="fmt">
        <option value="srt" data-i18n="export.fmt.srt"></option>
        <option value="vtt" data-i18n="export.fmt.vtt"></option>
        <option value="txt" data-i18n="export.fmt.txt"></option>
        <option value="json" data-i18n="export.fmt.json"></option>
      </select>
      <small id="export-hint" data-i18n="export.hint"></small>
    </label>
    <label><span data-i18n="export.view"></span>
      <select name="view">
        <option value="both" data-i18n="export.view.both"></option>
        <option value="tr" data-i18n="controls.mode.translation"></option>
        <option value="src" data-i18n="controls.mode.source"></option>
      </select>
    </label>
    <div class="row">
      <span class="grow"></span>
      <button value="cancel" formnovalidate data-i18n="dialog.cancel"></button>
      <button value="save" class="primary" data-i18n="export.download"></button>
    </div>
  </form>
</dialog>

<!-- First-time setup. Machines differ, so no single default fits them all. The
     default is the light CPU pair (SenseVoice Small + M2M-100), and moving up to
     the heavier side from here starts downloading what that combination needs.
     "Manage › ⚙ Engines › Run first-time setup again" reopens it at any time. -->
<dialog id="setup-dialog">
  <form method="dialog" id="setup-form">
    <h3 data-i18n="setup.title"></h3>
    <label class="field col">
      <span data-i18n="setup.uiLanguage"></span>
      <select id="setup-ui-lang">
        <option value="en" data-i18n="lang.en"></option>
        <option value="ko" data-i18n="lang.ko"></option>
      </select>
    </label>
    <p class="hint"><span data-i18n="setup.hint.intro"></span> <b data-i18n="setup.hint.default"></b><span data-i18n="setup.hint.rest"></span></p>
    <fieldset class="setup-group">
      <legend data-i18n="setup.group.asr"></legend>
      <div id="setup-asr" class="setup-choices"></div>
    </fieldset>
    <fieldset class="setup-group">
      <legend data-i18n="setup.group.tr"></legend>
      <div id="setup-tr" class="setup-choices"></div>
    </fieldset>
    <label><span data-i18n="manage.myLanguage"></span>
      <select name="viewer_lang">
        <option value="ko" data-i18n="lang.ko"></option>
        <option value="en" data-i18n="lang.en"></option>
        <option value="ja" data-i18n="lang.ja"></option>
        <option value="zh" data-i18n="lang.zh"></option>
      </select>
    </label>
    <p class="hint" id="setup-total">—</p>
    <div class="row">
      <span class="grow"></span>
      <button value="cancel" formnovalidate data-i18n="setup.later"></button>
      <button value="save" class="primary" id="setup-go" data-i18n="setup.go"></button>
    </div>
  </form>
</dialog>

<dialog id="settings-dialog">
  <div id="settings-body">
    <div class="dlg-head">
      <h3 data-i18n="settings.title"></h3>
      <button id="settings-close" class="seg" data-i18n="settings.close"></button>
    </div>

    <section class="engine-group" id="models-group">
      <div class="group-head">
        <h4 data-i18n="settings.models.title"></h4>
        <button class="seg ghost" data-add-model data-i18n="settings.models.add"></button>
      </div>
      <p class="hint"><span data-i18n="settings.models.hint.1"></span> <code id="model-dir">…</code>
         <span data-i18n="settings.models.hint.2"></span> <b>ffmpeg</b><span data-i18n="settings.models.hint.3"></span></p>
      <div id="model-list" class="engine-list"></div>
    </section>

    <section class="engine-group">
      <div class="group-head">
        <h4 data-i18n="settings.asr.title"></h4>
        <button class="seg ghost" data-add="asr" data-i18n="settings.add"></button>
      </div>
      <p class="hint"><span data-i18n="settings.asr.hint.1"></span> <code>/v1/audio/transcriptions</code>
         <span data-i18n="settings.asr.hint.2"></span></p>
      <div id="asr-list" class="engine-list"></div>
    </section>

    <section class="engine-group">
      <div class="group-head">
        <h4 data-i18n="settings.tr.title"></h4>
        <button class="seg ghost" data-add="tr" data-i18n="settings.add"></button>
      </div>
      <p class="hint"><span data-i18n="settings.tr.hint.1"></span> <code>/v1/chat/completions</code>
         <span data-i18n="settings.tr.hint.2"></span></p>
      <div id="tr-list" class="engine-list"></div>
    </section>

    <section class="engine-group">
      <div class="group-head">
        <h4 data-i18n="setup.title"></h4>
        <button id="setup-again" class="seg ghost" data-i18n="settings.setupAgain"></button>
      </div>
      <p class="hint" data-i18n="settings.setup.hint"></p>
    </section>

    <section class="engine-group" id="cookies-group">
      <div class="group-head">
        <h4 data-i18n="settings.cookies.title"></h4>
        <button id="cookies-delete" class="seg danger" hidden data-i18n="settings.cookies.delete"></button>
      </div>
      <p class="hint" id="cookies-hint" data-i18n="settings.cookies.hint"></p>
    </section>

    <section class="engine-group" id="update-group">
      <div class="group-head">
        <h4 data-i18n="settings.update.title"></h4>
        <button id="update-check" class="seg ghost" data-i18n="settings.update.check"></button>
      </div>
      <p class="hint" id="update-hint">—</p>
      <label><span data-i18n="update.token"></span>
        <input id="update-token" type="password" autocomplete="off" spellcheck="false"
               data-i18n-attr="placeholder:update.token.ph">
      </label>
      <p class="hint" data-i18n="update.token.hint"></p>
    </section>

    <section class="engine-group" id="glossary-group">
      <div class="group-head">
        <h4 data-i18n="settings.glossary.title"></h4>
        <button id="glossary-add" class="seg ghost" data-i18n="settings.glossary.add"></button>
      </div>
      <p class="hint" data-i18n="settings.glossary.hint"></p>
      <div id="glossary-list" class="engine-list"></div>
    </section>

    <section class="engine-group" id="shutdown-group">
      <div class="group-head">
        <h4 data-i18n="settings.server.title"></h4>
        <button id="shutdown" class="seg danger" data-i18n="settings.shutdown"></button>
      </div>
      <p class="hint"><span data-i18n="settings.server.hint.1"></span> <b data-i18n="settings.server.hint.strong"></b>
         <span data-i18n="settings.server.hint.2"></span> <code>./run.sh</code>.</p>
    </section>
  </div>

  <!-- Takes one GGUF from Hugging Face and registers it as an engine. For
       transcription it has to be a GGUF transcribe.cpp reads, for translation a
       chat model llama.cpp reads -- which only shows once it has been downloaded
       and first used. -->
  <form id="model-form" hidden>
    <div class="dlg-head">
      <h3 data-i18n="model.title"></h3>
      <button type="button" id="model-form-back" class="seg" data-i18n="model.back"></button>
    </div>
    <label><span data-i18n="model.kind"></span>
      <select name="kind">
        <option value="asr" data-i18n="model.kind.asr"></option>
        <option value="tr" data-i18n="model.kind.tr"></option>
      </select>
    </label>
    <label><span data-i18n="model.repo"></span> <input name="repo" data-i18n-attr="placeholder:model.repo.placeholder" required></label>
    <label><span data-i18n="model.file"></span> <input name="file" data-i18n-attr="placeholder:model.file.placeholder" required>
      <small data-i18n="model.file.hint"></small>
    </label>
    <label><span data-i18n="model.label"></span> <input name="label" data-i18n-attr="placeholder:model.label.placeholder"></label>
    <label><span data-i18n="model.id"></span> <input name="id" data-i18n-attr="placeholder:model.id.placeholder" pattern="[a-z0-9-]*"></label>
    <label><span data-i18n="model.device"></span>
      <select name="device">
        <option value="auto" data-i18n="model.device.auto"></option>
        <option value="cpu">CPU</option>
      </select>
    </label>
    <label><span data-i18n="model.token"></span> <input name="token" data-i18n-attr="placeholder:model.token.placeholder">
      <small><span data-i18n="model.token.hint.1"></span> <code>HF_TOKEN</code><span data-i18n="model.token.hint.2"></span></small>
    </label>
    <p class="hint" id="model-form-error" hidden></p>
    <div class="row">
      <span class="grow"></span>
      <button type="submit" class="primary" data-i18n="model.submit"></button>
    </div>
  </form>

  <form id="engine-form" hidden>
    <div class="dlg-head">
      <h3 id="form-title" data-i18n="engine.title"></h3>
      <button type="button" id="form-back" class="seg" data-i18n="engine.back"></button>
    </div>
    <label><span data-i18n="engine.label"></span> <input name="label" required></label>
    <label><span data-i18n="engine.id"></span> <input name="id" required pattern="[a-z0-9-]+"></label>
    <label><span data-i18n="engine.baseUrl"></span> <input name="base_url" placeholder="http://localhost:1234" required></label>
    <label><span data-i18n="engine.model"></span> <input name="model" required></label>
    <label><span data-i18n="engine.apiKey"></span> <input name="api_key" data-i18n-attr="placeholder:engine.apiKey.placeholder"></label>
    <label id="field-window"><span data-i18n="engine.window"></span>
      <input name="window_s" type="number" min="30" max="900" value="240">
      <small data-i18n="engine.window.hint"></small>
    </label>
    <label id="field-minchars"><span data-i18n="engine.minChars"></span>
      <input name="min_chars" type="number" min="0" max="20" value="0">
      <small data-i18n="engine.minChars.hint"></small>
    </label>
    <div class="row">
      <span class="grow"></span>
      <button type="submit" class="primary" data-i18n="engine.submit"></button>
    </div>
  </form>

  <!-- One channel's glossary: a name, the key it is looked up by, and the
       terms, one line each. docs/GLOSSARY.md. -->
  <form id="glossary-form" hidden>
    <div class="dlg-head">
      <h3 id="glossary-form-title" data-i18n="settings.glossary.form.add"></h3>
      <button type="button" id="glossary-form-back" class="seg" data-i18n="settings.glossary.form.back"></button>
    </div>
    <label><span data-i18n="settings.glossary.form.name"></span> <input name="name" required data-i18n-attr="placeholder:settings.glossary.form.namePlaceholder"></label>
    <label><span data-i18n="settings.glossary.form.key"></span> <input name="key" data-i18n-attr="placeholder:settings.glossary.form.keyPlaceholder">
      <small data-i18n="settings.glossary.form.keyHint"></small>
    </label>
    <label><span data-i18n="settings.glossary.form.terms"></span>
      <textarea name="terms" rows="8" data-i18n-attr="placeholder:settings.glossary.form.termsPlaceholder"></textarea>
      <small data-i18n="settings.glossary.form.termsHint"></small>
    </label>
    <p class="hint" data-i18n="settings.glossary.form.warn"></p>
    <p class="hint" id="glossary-form-error" hidden></p>
    <div class="row">
      <span class="grow"></span>
      <button type="button" id="glossary-form-delete" class="seg danger" data-i18n="settings.glossary.form.delete"></button>
      <button type="submit" class="primary" data-i18n="settings.glossary.form.save"></button>
    </div>
  </form>
</dialog>

<!-- `async`, deliberately. Left synchronous the parser stops here, and nothing at
     all is painted while the script is fetched from Google. Measured, this one
     line ate 4396ms and domInteractive was 4435ms -- with our own CSS and JS at
     10ms each and the API responses at 1~10ms each. app.js's whenApiReady()
     already handles it arriving late, through onYouTubeIframeAPIReady and
     polling, so there is no reason to block on it. -->
<script async src="https://www.youtube.com/iframe_api"></script>
<!-- The sets shared with the extension. Subtitle drawing (overlay), the live cue
     store (cuestore), tab audio upload (capture). bench/ext_check.py holds the
     copies in the extension folder against these. -->
<!-- The string table comes first: overlay.js and every app module call t()
     while they build their first frame, and a missing table renders keys. -->
<script src="/static/i18n.js"></script>
<script src="/static/strings-ext.js"></script>
<script src="/static/app/strings/core.js"></script>
<script src="/static/app/strings/player.js"></script>
<script src="/static/app/strings/panel.js"></script>
<script src="/static/app/strings/engines.js"></script>
<script src="/static/overlay.js"></script>
<script src="/static/cuestore.js"></script>
<script src="/static/capture.js"></script>
<!-- The screen logic. What used to be one file (app.js, 2700 lines) split up by
     concern. They are all plain scripts sharing one global scope, so the order
     means something -- state.js first, main.js (bind and init) last. The rest are
     nothing but function declarations, so they do not depend on the order. -->
<script src="/static/app/state.js"></script>
<script src="/static/app/adapters.js"></script>
<script src="/static/app/tiles.js"></script>
<script src="/static/app/player.js"></script>
<script src="/static/app/script-panel.js"></script>
<script src="/static/app/engines.js"></script>
<script src="/static/app/jobs.js"></script>
<script src="/static/app/live.js"></script>
<script src="/static/app/capture.js"></script>
<script src="/static/app/export.js"></script>
<script src="/static/app/library.js"></script>
<script src="/static/app/bus.js"></script>
<script src="/static/app/update.js"></script>
<script src="/static/app/main.js"></script>
</body>
</html>
