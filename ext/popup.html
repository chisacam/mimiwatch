<meta charset="utf-8">
<title>mimiwatch</title>
<link rel="stylesheet" href="popup.css">
<div class="wrap">
  <h1>mimi<em>watch</em></h1>
  <p id="err" class="err" hidden></p>
  <label><span data-i18n="popup.pick"></span>
    <select id="pick"><option value="" data-i18n="popup.pickNone"></option></select>
  </label>

  <!-- 지금 이 탭에서 바로 시작합니다. 주소를 다시 붙여 넣을 이유가 없습니다
       -- 확장은 이미 어느 탭인지 압니다. -->
  <fieldset id="start-box">
    <legend data-i18n="popup.startBox"></legend>
    <div class="row">
      <button id="start-url" class="seg" data-i18n="popup.fromUrl"></button>
      <button id="start-tab" class="seg" data-i18n="popup.fromTab"></button>
    </div>
    <!-- 멤버십 전용 방송을 주소로 받는 길. 누른 그 순간의 로그인 쿠키만 서버에 넘기고
         시작합니다 -- 켜 두는 스위치가 아니라 일회성입니다. -->
    <div class="row">
      <button id="start-url-cookies" class="seg wide" data-i18n="popup.fromUrlWithCookies"
              data-i18n-attr="title:popup.fromUrlWithCookiesTitle"></button>
    </div>
    <p class="hint" id="start-hint" data-i18n="popup.hintStart"></p>
    <div class="row">
      <label class="slider"><span data-i18n="popup.sourceLang"></span>
        <select id="lang">
          <option value="" data-i18n="popup.lang.auto"></option>
          <option value="ja" data-i18n="popup.lang.ja"></option>
          <option value="en" data-i18n="popup.lang.en"></option>
          <option value="ko" data-i18n="popup.lang.ko"></option>
          <option value="zh" data-i18n="popup.lang.zh"></option>
        </select>
      </label>
      <label class="slider"><span data-i18n="popup.genre"></span> <select id="genre"></select></label>
    </div>
    <label class="slider"><span data-i18n="popup.viewer"></span>
      <select id="viewer">
        <option value="ko" data-i18n="popup.lang.ko"></option>
        <option value="en" data-i18n="popup.lang.en"></option>
        <option value="ja" data-i18n="popup.lang.ja"></option>
        <option value="zh" data-i18n="popup.lang.zh"></option>
      </select>
    </label>
    <label><span data-i18n="popup.profile"></span>
      <select id="profile"></select>
      <small id="profile-hint" data-i18n="popup.hintProfileNone"></small>
    </label>
    <label class="check"><input id="refine" type="checkbox"> <span data-i18n="popup.refine"></span></label>
    <p class="hint"><span data-i18n="popup.refineHint"></span> <b data-i18n="popup.refineHintLive"></b></p>
  </fieldset>
  <div class="row">
    <button class="seg" data-mode="both" data-i18n="popup.mode.both"></button>
    <button class="seg" data-mode="translation" data-i18n="popup.mode.translation"></button>
    <button class="seg" data-mode="source" data-i18n="popup.mode.source"></button>
    <button class="seg" data-mode="off" data-i18n="popup.mode.off"></button>
  </div>
  <label class="slider"><span data-i18n="popup.size"></span> <input id="size" type="range" min="16" max="56"></label>
  <label class="slider"><span data-i18n="popup.dim"></span> <input id="dim" type="range" min="0" max="100"></label>
  <label class="slider"><span data-i18n="popup.offset"></span> <input id="offset" type="range" min="-5" max="5" step="0.1"><b id="offset-val">0.0s</b></label>
  <label class="check"><input id="show-prev" type="checkbox"> <span data-i18n="popup.showPrev"></span></label>
  <label class="check"><input id="panel" type="checkbox"> <span data-i18n="popup.panel"></span></label>
  <div class="row">
    <button id="reset-pos" class="seg" data-i18n="popup.resetPos"></button>
    <span class="grow"></span>
    <button id="hide" class="seg" data-i18n="popup.hide"></button>
  </div>
  <div class="row">
    <!-- 이어받기는 따로 단추를 두지 않습니다. 고르개에서 멈춘 방송을 고르면 위의 「주소로」
         「이 탭 소리로」가 이어받기로 바뀝니다 -- 같은 일을 하는 단추가 둘이면 헷갈립니다. -->
    <button id="stop" class="seg danger wide" data-i18n="popup.stop"
            data-i18n-attr="title:popup.stopTitle"></button>
  </div>
  <p class="hint" id="state">—</p>
  <label class="slider"><span data-i18n="popup.server"></span> <input id="base" type="text" spellcheck="false"
         data-i18n-attr="title:popup.serverTitle"></label>
</div>
<script src="i18n.js"></script>
<script src="strings-ext.js"></script>
<script src="popup.js"></script>
