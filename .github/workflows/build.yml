# Builds the macOS (Apple Silicon) and Windows (x64) bundles. Pushing a tag attaches
# them to the release.
#
# Models are not included -- a bundle is 300~400MB and the models are fetched from the
# screen on first run. On macOS llama-cpp-python is built from source (Metal), which
# takes a few minutes.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Creating a release needs write permission on GITHUB_TOKEN. If the repository default
# is read-only the last step dies with a 403 -- which is what the first tag build did.
permissions:
  contents: write

jobs:
  # The browser extension. There is nothing to build: ext/ is zipped as it is and
  # attached to the release, so somebody who did not clone the whole repository can
  # still add it with "Load unpacked". One minute on a Linux runner.
  ext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Zip the extension folder
        run: |
          VERSION=$(git describe --tags --always)
          python3 bench/ext_check.py
          cp LICENSE ext/LICENSE
          zip -qr "mimiwatch-ext-$VERSION.zip" ext -x 'ext/.DS_Store'
          ls -l mimiwatch-ext-*.zip
      # The upload is a convenience for runs that are not a tag (workflow_dispatch);
      # the release below attaches the same files by itself. It must never be able to
      # stop a release: on v0.5.0 the account's artifact storage was full, every job
      # died here, and the release step -- which comes after -- never ran at all.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: mimiwatch-ext
          path: mimiwatch-ext-*.zip
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: mimiwatch-ext-*.zip

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Apple Silicon runner, built with Metal. (macos-14 retired 2026-11-02)
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
            backend: vulkan
          # The NVIDIA-only CUDA build (-Backend cuda) is out of the release. The cu124
          # wheels carry no RTX 50 (Blackwell, sm_120) kernels, so it means nothing on a
          # recent card, and it is not worth shipping another 726MB. Whoever wants it
          # builds it with build.ps1 -Backend cuda.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the version name comes from git describe
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake >/dev/null 2>&1 || true
          PYTHON=python packaging/build.sh
      - name: Build the bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\packaging\build.ps1 -Backend ${{ matrix.backend }}
      # The guard the non-fatal upload below can no longer provide. It has to pass on
      # *either* extension: build.sh writes a .zip on macOS and a .tar.gz only on Linux,
      # which is not in this matrix, so requiring both fails every release job -- which
      # is exactly what the first attempt at this step did.
      - name: Check a bundle was produced
        shell: bash
        run: |
          shopt -s nullglob
          found=(dist/*.zip dist/*.tar.gz)
          if [ ${#found[@]} -eq 0 ]; then echo "no bundle in dist/"; ls -l dist/ || true; exit 1; fi
          ls -l "${found[@]}"
      # The upload is a convenience for runs that are not a tag (workflow_dispatch);
      # the release below attaches the same files by itself. It must never be able to
      # stop a release: on v0.5.0 the account's artifact storage was full, every job
      # died here, and the release step -- which comes after -- never ran at all.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: mimiwatch-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
