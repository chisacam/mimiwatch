# 맥(Apple Silicon)과 윈도우(x64) 묶음을 만듭니다. 태그를 밀면 릴리스에 붙입니다.
#
# 모델은 넣지 않습니다 -- 묶음은 300~400MB, 모델은 첫 실행 때 화면에서 받습니다.
# 맥에서는 llama-cpp-python 을 소스에서 빌드하므로(Metal) 몇 분이 걸립니다.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 릴리스를 만들려면 GITHUB_TOKEN 에 쓰기 권한이 있어야 합니다. 저장소 기본값이
# 읽기 전용이면 마지막 단계가 403 으로 죽습니다 -- 첫 태그 빌드가 그랬습니다.
permissions:
  contents: write

jobs:
  # 브라우저 확장. 빌드할 것은 없고 ext/ 를 그대로 zip 으로 묶어 릴리스에 붙입니다 --
  # 저장소를 통째로 받지 않은 사람도 「압축 해제된 확장 프로그램을 로드」로 얹을 수
  # 있게요. 리눅스 러너 1분이면 됩니다.
  ext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 확장 폴더 압축
        run: |
          VERSION=$(git describe --tags --always)
          python3 bench/ext_check.py
          cp LICENSE ext/LICENSE
          zip -qr "mimiwatch-ext-$VERSION.zip" ext -x 'ext/.DS_Store'
          ls -l mimiwatch-ext-*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: mimiwatch-ext
          path: mimiwatch-ext-*.zip
          if-no-files-found: error
      - name: 릴리스에 붙이기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: mimiwatch-ext-*.zip

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Apple Silicon 러너. Metal 로 빌드됩니다. (macos-14 는 2026-11-02 폐기)
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
            backend: vulkan
          # NVIDIA 전용 CUDA 판(-Backend cuda)은 릴리스에서 뺐습니다. cu124 휠의 커널이
          # RTX 50(Blackwell, sm_120)을 담지 않아 최신 카드에서는 뜻이 없고, 726MB 를 더
          # 배포할 만한 이득이 아닙니다. 필요하면 build.ps1 -Backend cuda 로 직접 만듭니다.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # git describe 로 판 이름을 얻습니다
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 묶음 만들기 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake >/dev/null 2>&1 || true
          PYTHON=python packaging/build.sh
      - name: 묶음 만들기 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\packaging\build.ps1 -Backend ${{ matrix.backend }}
      - uses: actions/upload-artifact@v7
        with:
          name: mimiwatch-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
      - name: 릴리스에 붙이기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
