<meta charset="utf-8">
<title>mimiwatch</title>
<link rel="stylesheet" href="popup.css">
<div class="wrap">
  <h1>mimi<em>watch</em></h1>
  <p id="err" class="err" hidden></p>
  <label>무엇을 얹을까요
    <select id="pick"><option value="">— 고르지 않음 —</option></select>
  </label>
  <div class="row">
    <button class="seg" data-mode="both">둘 다</button>
    <button class="seg" data-mode="translation">번역만</button>
    <button class="seg" data-mode="source">원문만</button>
    <button class="seg" data-mode="off">끄기</button>
  </div>
  <label class="slider">글자 크기 <input id="size" type="range" min="16" max="56"></label>
  <label class="slider">배경 <input id="dim" type="range" min="0" max="100"></label>
  <label class="slider">오프셋 <input id="offset" type="range" min="-5" max="5" step="0.1"><b id="offset-val">0.0s</b></label>
  <label class="check"><input id="show-prev" type="checkbox"> 직전 문장 남기기</label>
  <div class="row">
    <button id="reset-pos" class="seg">⤾ 위치 되돌리기</button>
    <span class="grow"></span>
    <button id="stop" class="seg danger">치우기</button>
  </div>
  <p class="hint" id="state">—</p>
  <label class="slider">서버 <input id="base" type="text" spellcheck="false"></label>
</div>
<script src="popup.js"></script>
